<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>لقطة | Laqta</title>
<meta name="description" content="لقطة: بنكتب ونصوّر ونمنتج وندير صفحات البراندات في مصر والخليج.">
<meta property="og:title" content="لقطة | Laqta">
<meta property="og:description" content="بنمسك لقطتك.. وإنت كمّل شغلك.">
<meta property="og:image" content="assets/laqta-logo.png">
<link rel="icon" type="image/png" href="assets/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;800;900&family=Tajawal:wght@400;500;700;800;900&display=swap" rel="stylesheet">
<style>
:root{--bg:#09090b;--bg2:#0f0f12;--card:#151518;--line:#26262c;--tx:#f4f2ee;--mut:#a09ea8;--acc:#FF4B2B;--max:1180px;--ease:cubic-bezier(.2,.7,.2,1)}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--tx);font-family:Tajawal,Inter,system-ui,sans-serif;line-height:1.7;-webkit-font-smoothing:antialiased;overflow-x:hidden}
html[lang=en] body{font-family:Inter,Tajawal,system-ui,sans-serif}
a{color:inherit;text-decoration:none}
img{display:block;max-width:100%}
.wrap{max-width:var(--max);margin:auto;padding:0 20px}
section{padding:84px 0;position:relative}
.eyebrow{display:flex;align-items:center;gap:10px;color:var(--acc);font-weight:700;font-size:13px;letter-spacing:.5px;margin-bottom:10px}
.eyebrow::before{content:"";width:9px;height:9px;border-radius:50%;background:var(--acc);animation:blink 1.4s infinite}
h2{font-size:clamp(28px,4.6vw,46px);font-weight:900;line-height:1.2;margin-bottom:12px}
.lead{color:var(--mut);max-width:620px;font-size:17px}

/* reveal */
.rv{opacity:0;transform:translateY(28px);transition:opacity .8s var(--ease),transform .8s var(--ease);transition-delay:var(--d,0s)}
.rv.in{opacity:1;transform:none}
.rv.zoom{transform:scale(.94)}
.rv.zoom.in{transform:none}

/* progress bar */
#bar{position:fixed;top:0;inset-inline-start:0;height:3px;background:var(--acc);width:0;z-index:100;box-shadow:0 0 12px var(--acc)}

/* nav */
nav{position:sticky;top:0;z-index:50;background:#09090bcc;backdrop-filter:blur(12px);border-bottom:1px solid transparent;transition:.3s}
nav.sc{border-color:var(--line)}
.nav{display:flex;align-items:center;justify-content:space-between;gap:12px;height:66px}
.nav img.logo{height:34px;width:auto}
.nav ul{display:none;list-style:none;gap:24px;font-size:15px;color:var(--mut)}
.nav ul a{position:relative}
.nav ul a::after{content:"";position:absolute;bottom:-4px;inset-inline-start:0;width:0;height:2px;background:var(--acc);transition:width .3s var(--ease)}
.nav ul a:hover{color:var(--tx)}.nav ul a:hover::after{width:100%}
@media(min-width:860px){.nav ul{display:flex}}
.btn{position:relative;overflow:hidden;display:inline-flex;align-items:center;justify-content:center;gap:8px;background:var(--acc);color:#fff;border:0;border-radius:999px;padding:13px 24px;font:inherit;font-weight:800;cursor:pointer;transition:transform .25s var(--ease),box-shadow .25s}
.btn:hover{transform:translateY(-2px);box-shadow:0 10px 30px -8px #ff4b2b99}
.btn::after{content:"";position:absolute;top:0;left:-60%;width:40%;height:100%;background:linear-gradient(90deg,transparent,#ffffff55,transparent);transform:skewX(-20deg);animation:shine 3.5s infinite}
@keyframes shine{0%,70%{left:-60%}100%{left:130%}}
.btn.ghost{background:transparent;border:1px solid #3a3a42;color:var(--tx)}
.btn.ghost::after{display:none}
.btn.sm{padding:8px 16px;font-size:14px}
.btn svg{width:18px;height:18px;fill:currentColor}
.lang{background:transparent;color:var(--tx);border:1px solid #3a3a42;border-radius:999px;padding:6px 14px;font:inherit;font-size:13px;cursor:pointer}

/* hero */
.hero{padding:56px 0 30px;position:relative;overflow:hidden;min-height:calc(100vh - 66px);display:flex;flex-direction:column;justify-content:center}
.hero .spot{position:absolute;inset:0;pointer-events:none;background:radial-gradient(500px circle at var(--mx,70%) var(--my,30%),#ff4b2b26,transparent 60%);transition:background .1s}
.hero .grain{position:absolute;inset:0;pointer-events:none;opacity:.06;background-image:radial-gradient(#fff 1px,transparent 1px);background-size:3px 3px}
.rec{display:inline-flex;align-items:center;gap:10px;font:600 12.5px/1 Inter,monospace;letter-spacing:1px;color:var(--mut);margin-bottom:22px;border:1px solid var(--line);border-radius:999px;padding:8px 14px;background:#0009}
.rec i{width:10px;height:10px;border-radius:50%;background:var(--acc);animation:blink 1.1s infinite}
.rec b{color:var(--tx);font-variant-numeric:tabular-nums;font-weight:600}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.2}}
.hero h1{font-size:clamp(38px,7.6vw,84px);font-weight:900;line-height:1.12;margin-bottom:20px;max-width:960px}
.hero h1 .hw{display:inline-block;opacity:0;transform:translateY(60%) rotate(4deg);filter:blur(8px);animation:wordIn .9s var(--ease) forwards;animation-delay:calc(var(--i)*90ms + .15s)}
.hero h1 em{font-style:normal;color:var(--acc)}
@keyframes wordIn{to{opacity:1;transform:none;filter:none}}
.hero p.sub{color:var(--mut);font-size:clamp(16px,2.2vw,20px);max-width:620px;margin-bottom:30px;opacity:0;animation:fadeUp .9s var(--ease) .9s forwards}
.hero .cta{opacity:0;animation:fadeUp .9s var(--ease) 1.05s forwards}
@keyframes fadeUp{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:none}}
.cta{display:flex;gap:12px;flex-wrap:wrap}

/* reel strip */
.strip{position:relative;margin-top:46px;direction:ltr;mask-image:linear-gradient(90deg,transparent,#000 8%,#000 92%,transparent);-webkit-mask-image:linear-gradient(90deg,transparent,#000 8%,#000 92%,transparent)}
.track{display:flex;gap:12px;width:max-content;animation:marq var(--dur,60s) linear infinite}
.track.rev{animation-direction:reverse}
.strip:hover .track{animation-play-state:paused}
@keyframes marq{to{transform:translateX(-50%)}}
.reel{position:relative;flex:none;width:132px;aspect-ratio:9/14;border-radius:12px;overflow:hidden;background:#1a1a1e;border:1px solid #ffffff14;transition:transform .35s var(--ease)}
.reel:hover{transform:translateY(-6px) scale(1.04)}
.reel img{width:100%;height:100%;object-fit:cover}
.reel span{position:absolute;bottom:6px;left:6px;background:var(--acc);border-radius:5px;padding:1px 7px;font:800 11px Inter;color:#fff}
.strip+.strip{margin-top:12px}
@media(min-width:760px){.reel{width:160px}}

/* stats */
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:1px;background:var(--line);border:1px solid var(--line);border-radius:18px;overflow:hidden;margin-top:40px}
@media(min-width:760px){.stats{grid-template-columns:repeat(4,1fr)}}
.stat{background:var(--bg);padding:22px 20px;position:relative}
.stat b{display:block;font:900 clamp(32px,5vw,50px)/1.1 Inter,sans-serif;letter-spacing:-1.5px;direction:ltr;text-align:start}
html[dir=rtl] .stat b{text-align:right}
.stat span{color:var(--mut);font-size:14px}

/* logos marquee */
.logos{direction:ltr;overflow:hidden;mask-image:linear-gradient(90deg,transparent,#000 10%,#000 90%,transparent);-webkit-mask-image:linear-gradient(90deg,transparent,#000 10%,#000 90%,transparent);margin-top:34px}
.logos .track{gap:16px;--dur:45s}
.logos:hover .track{animation-play-state:paused}
.lg{flex:none;width:120px;height:120px;border-radius:22px;overflow:hidden;border:1px solid #ffffff14;background:#fff;display:flex;align-items:center;justify-content:center;transition:transform .35s var(--ease),box-shadow .35s;position:relative}
.lg img{width:100%;height:100%;object-fit:cover}
.lg.ct img{object-fit:contain;padding:12px}
.lg:hover{transform:translateY(-6px) rotate(-3deg);box-shadow:0 18px 40px -12px #ff4b2b66}
@media(min-width:760px){.lg{width:140px;height:140px}}
.lg-name{display:block;text-align:center;font-size:12.5px;color:var(--mut);margin-top:8px;direction:rtl}
.lgw{flex:none;text-align:center}

/* cases */
.cases{display:grid;gap:16px;margin-top:34px}
@media(min-width:760px){.cases{grid-template-columns:1fr 1fr}}
.case{position:relative;border-radius:22px;overflow:hidden;border:1px solid var(--line);min-height:380px;display:flex;align-items:flex-end;background:#151518;isolation:isolate}
.case .bg{position:absolute;inset:-6%;background-size:cover;background-position:center;opacity:.6;transition:transform 1.2s var(--ease),opacity .5s;transform:scale(1.02) translateY(var(--py,0px));z-index:-2}
.case:hover .bg{transform:scale(1.12) translateY(var(--py,0px));opacity:.8}
.case::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,#09090b10 10%,#09090bf5 88%);z-index:-1}
.case .corner{position:absolute;width:26px;height:26px;border:3px solid #fff;opacity:0;transition:.4s var(--ease)}
.case .c1{top:16px;inset-inline-start:16px;border-inline-end:0;border-bottom:0;transform:translate(10px,10px)}
.case .c2{bottom:16px;inset-inline-end:16px;border-inline-start:0;border-top:0;transform:translate(-10px,-10px)}
.case:hover .corner{opacity:1;transform:none}
.case .rd{position:absolute;top:18px;inset-inline-end:18px;display:flex;gap:6px;align-items:center;font:700 11px Inter;opacity:0;transition:.4s}
.case .rd::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--acc);animation:blink 1s infinite}
.case:hover .rd{opacity:1}
.case .in{padding:26px;width:100%}
.case .clogo{width:46px;height:46px;border-radius:12px;overflow:hidden;margin-bottom:12px;border:1px solid #ffffff22}
.case .clogo img{width:100%;height:100%;object-fit:cover}
.case .tag{font:700 12px Inter;letter-spacing:.8px;color:var(--acc)}
.case h3{font-size:28px;font-weight:900;margin:2px 0 6px}
.case p{color:#d4d2d9;font-size:15px;max-width:480px}
.case .num{font:900 clamp(38px,5.4vw,56px)/1 Inter;margin-top:14px;letter-spacing:-1.5px;direction:ltr;display:inline-block}
.case .num small{font-size:13px;font-weight:500;color:var(--mut);letter-spacing:0;margin-inline-start:8px}
.badge{display:inline-block;font-size:12px;border:1px solid #ffffff33;border-radius:999px;padding:2px 10px;color:#ddd;margin-top:12px;background:#00000066}
.strat{display:grid;gap:14px;margin-top:16px}
@media(min-width:760px){.strat{grid-template-columns:repeat(3,1fr)}}
.box{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:22px;transition:border-color .3s,transform .4s var(--ease)}
.box:hover{border-color:#ff4b2b66;transform:translateY(-4px)}
.box h3{font-size:18px;margin-bottom:6px}
.box p{color:var(--mut);font-size:15px}
.box .top{display:flex;align-items:center;gap:12px;margin-bottom:10px}
.box .top img{width:42px;height:42px;border-radius:10px;object-fit:cover;background:#fff}
.box .k{font:900 26px Inter;direction:ltr}

/* work */
.chips{display:flex;gap:8px;flex-wrap:wrap;margin:28px 0 22px}
.chip{display:inline-flex;align-items:center;gap:7px;background:var(--card);color:var(--mut);border:1px solid var(--line);border-radius:999px;padding:6px 14px 6px 6px;font:inherit;font-size:14px;cursor:pointer;transition:.25s}
html[dir=rtl] .chip{padding:6px 6px 6px 14px}
.chip img{width:24px;height:24px;border-radius:50%;object-fit:cover;background:#fff}
.chip.all{padding:6px 16px!important}
.chip:hover{border-color:#555;color:var(--tx)}
.chip.on{background:var(--tx);color:#09090b;border-color:var(--tx);font-weight:800}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
@media(min-width:700px){.grid{grid-template-columns:repeat(3,1fr)}}
@media(min-width:1000px){.grid{grid-template-columns:repeat(4,1fr)}}
.w{position:relative;display:block;border-radius:16px;overflow:hidden;background:var(--card);border:1px solid var(--line);transition:transform .4s var(--ease),border-color .3s;opacity:0;animation:cardIn .6s var(--ease) forwards;animation-delay:calc(var(--i)*45ms)}
@keyframes cardIn{from{opacity:0;translate:0 18px;scale:.97}to{opacity:1;translate:0 0;scale:1}}
a.w:hover{border-color:#ff4b2b88;transform:translateY(-4px)}
.w .th{position:relative;aspect-ratio:4/5;background:#121215;overflow:hidden}
.w .th>img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transition:transform .8s var(--ease)}
a.w:hover .th>img{transform:scale(1.08)}
.w .th.lo>img.blur{filter:blur(22px) brightness(.5) saturate(1.3);transform:scale(1.3)}
.w .th.lo>img.mark{inset:auto;position:absolute;top:50%;left:50%;width:46%;height:auto;aspect-ratio:1;object-fit:cover;transform:translate(-50%,-50%);border-radius:18px;box-shadow:0 12px 30px #0008}
a.w:hover .th.lo>img.mark{transform:translate(-50%,-50%) scale(1.08)}
.w .th.lo>img.mark.ct{object-fit:contain;background:#fff;padding:8px}
.w .play{position:absolute;top:50%;left:50%;width:52px;height:52px;margin:-26px 0 0 -26px;border-radius:50%;background:#ff4b2be6;display:flex;align-items:center;justify-content:center;opacity:0;transform:scale(.6);transition:.35s var(--ease);z-index:3}
.w .play::before{content:"";border-left:15px solid #fff;border-top:9px solid transparent;border-bottom:9px solid transparent;margin-left:4px}
a.w:hover .play{opacity:1;transform:none}
.w .plat{position:absolute;top:8px;inset-inline-start:8px;z-index:2;background:#000b;border-radius:6px;padding:2px 8px;font:600 11px Inter}
.w .views{position:absolute;bottom:8px;inset-inline-start:8px;z-index:2;background:var(--acc);border-radius:6px;padding:2px 8px;font:800 12px Inter}
.w .meta{padding:10px 12px}
.w .meta b{display:block;font-size:14px;line-height:1.45}
.w .meta span{color:var(--mut);font-size:12.5px}
.more{display:flex;justify-content:center;margin-top:26px}

/* services */
.svc{display:grid;gap:14px;margin-top:34px}
@media(min-width:700px){.svc{grid-template-columns:repeat(2,1fr)}}
@media(min-width:1000px){.svc{grid-template-columns:repeat(3,1fr)}}
.svc .box{position:relative;overflow:hidden}
.svc .box::before{content:"";position:absolute;inset:0;background:radial-gradient(300px circle at var(--x,50%) var(--y,50%),#ff4b2b1f,transparent 60%);opacity:0;transition:opacity .3s}
.svc .box:hover::before{opacity:1}
.svc .box .n{font:800 13px Inter;color:var(--acc);margin-bottom:10px;position:relative}
.svc .box h3,.svc .box p{position:relative}
.steps{display:grid;gap:22px;margin-top:34px;counter-reset:s}
@media(min-width:760px){.steps{grid-template-columns:repeat(3,1fr)}}
.step{position:relative;padding-top:18px}
.step::before{content:"";position:absolute;top:0;inset-inline-start:0;height:2px;width:0;background:var(--acc);transition:width 1.1s var(--ease);transition-delay:var(--d,0s)}
.step.in::before{width:100%}
.step b{display:block;font-size:20px;margin-bottom:6px}
.step b i{font:900 14px Inter;color:var(--acc);font-style:normal;margin-inline-end:8px}
.step p{color:var(--mut);font-size:15px}
.tools{direction:ltr;overflow:hidden;margin-top:46px;mask-image:linear-gradient(90deg,transparent,#000 10%,#000 90%,transparent);-webkit-mask-image:linear-gradient(90deg,transparent,#000 10%,#000 90%,transparent)}
.tools .track{gap:10px;--dur:40s}
.tools span{flex:none;border:1px solid var(--line);border-radius:999px;padding:7px 16px;font:500 14px Inter;color:var(--mut)}

/* contact */
.contact{text-align:center;overflow:hidden}
.contact::before{content:"";position:absolute;left:50%;bottom:-260px;width:700px;height:520px;margin-left:-350px;background:radial-gradient(closest-side,#ff4b2b40,transparent);animation:pulse 5s ease-in-out infinite;pointer-events:none}
@keyframes pulse{50%{transform:scale(1.15);opacity:.7}}
.contact h2{max-width:760px;margin-inline:auto;font-size:clamp(32px,6vw,62px)}
.contact .cta{justify-content:center;margin-top:26px}
.contact .vf{display:inline-block;position:relative;padding:34px 26px}
.contact .vf i{position:absolute;width:30px;height:30px;border:3px solid var(--tx)}
.contact .vf i:nth-child(1){top:0;left:0;border-right:0;border-bottom:0}
.contact .vf i:nth-child(2){top:0;right:0;border-left:0;border-bottom:0}
.contact .vf i:nth-child(3){bottom:0;left:0;border-right:0;border-top:0}
.contact .vf i:nth-child(4){bottom:0;right:0;border-left:0;border-top:0}
.contact .vf.in i{animation:focus 1.2s var(--ease)}
@keyframes focus{0%{transform:scale(1.6);opacity:0}100%{transform:none;opacity:1}}
footer{border-top:1px solid var(--line);padding:26px 0;color:var(--mut);font-size:13.5px}
footer .wrap{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;align-items:center}
footer img{height:26px}
.fab{position:fixed;bottom:20px;inset-inline-end:20px;z-index:60;width:56px;height:56px;border-radius:50%;background:#25D366;display:flex;align-items:center;justify-content:center;box-shadow:0 10px 30px -6px #25d36699;transform:scale(0);transition:transform .4s var(--ease)}
.fab.on{transform:scale(1)}
.fab svg{width:28px;height:28px;fill:#fff}
.fab::after{content:"";position:absolute;inset:0;border-radius:50%;border:2px solid #25D366;animation:ring 2s infinite}
@keyframes ring{to{transform:scale(1.6);opacity:0}}

@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}.rv,.w,.hero h1 .hw,.hero p.sub,.hero .cta{opacity:1!important;transform:none!important;filter:none!important}}
</style>
</head>
<body>
<div id="bar"></div>
<nav id="nav"><div class="wrap nav">
  <a href="#top" aria-label="Laqta"><img class="logo" src="assets/laqta-logo.png" alt="لقطة | Laqta"></a>
  <ul>
    <li><a href="#work" data-i18n="nav_work"></a></li>
    <li><a href="#cases" data-i18n="nav_cases"></a></li>
    <li><a href="#services" data-i18n="nav_services"></a></li>
    <li><a href="#contact" data-i18n="nav_contact"></a></li>
  </ul>
  <div style="display:flex;gap:8px;align-items:center">
    <button class="lang" id="langBtn" type="button">EN</button>
    <a class="btn sm wa" href="#" target="_blank" rel="noopener" data-i18n="cta_talk"></a>
  </div>
</div></nav>

<header class="hero" id="top">
  <div class="spot"></div><div class="grain"></div>
  <div class="wrap" style="position:relative">
    <div class="rec"><i></i>REC <b id="tc">00:00:00:00</b> · LAQTA</div>
    <h1 id="heroTitle"></h1>
    <p class="sub" data-i18n="hero_sub"></p>
    <div class="cta">
      <a class="btn wa" href="#" target="_blank" rel="noopener"><svg viewBox="0 0 24 24"><path d="M12 2a10 10 0 0 0-8.6 15.1L2 22l5-1.3A10 10 0 1 0 12 2zm5.4 14.1c-.2.6-1.3 1.2-1.8 1.2-.5.1-1 .2-3.3-.7-2.8-1.1-4.5-3.9-4.7-4.1-.1-.2-1.1-1.5-1.1-2.9s.7-2.1 1-2.4c.3-.3.6-.3.8-.3h.6c.2 0 .4 0 .6.5l.9 2.1c.1.2.1.4 0 .5l-.3.5-.4.5c-.1.1-.3.3-.1.6.2.3.8 1.3 1.7 2.1 1.2 1 2.1 1.4 2.4 1.5.3.1.5.1.6-.1l.9-1c.2-.3.4-.2.6-.1l2 .9c.3.1.5.2.5.3.1.1.1.6-.1 1.2z"/></svg><span data-i18n="cta_whatsapp"></span></a>
      <a class="btn ghost" href="#work" data-i18n="cta_work"></a>
    </div>
  </div>
  <div class="strip"><div class="track" id="strip1" style="--dur:70s"></div></div>
  <div class="strip"><div class="track rev" id="strip2" style="--dur:80s"></div></div>
  <div class="wrap"><div class="stats rv" id="stats"></div></div>
</header>

<section id="clients"><div class="wrap">
  <div class="eyebrow rv" data-i18n="eb_clients"></div>
  <h2 class="rv" style="--d:.08s" data-i18n="h_clients"></h2>
  <p class="lead rv" style="--d:.16s" data-i18n="p_clients"></p>
</div>
  <div class="logos rv" style="--d:.2s"><div class="track" id="logoTrack"></div></div>
  <div class="logos rv" style="--d:.28s;margin-top:16px"><div class="track rev" id="logoTrack2" style="--dur:52s"></div></div>
</section>

<section id="cases" style="background:var(--bg2)"><div class="wrap">
  <div class="eyebrow rv" data-i18n="eb_cases"></div>
  <h2 class="rv" style="--d:.08s" data-i18n="h_cases"></h2>
  <p class="lead rv" style="--d:.16s" data-i18n="p_cases"></p>
  <div class="cases" id="caseGrid"></div>
  <div class="strat" id="stratGrid"></div>
</div></section>

<section id="work"><div class="wrap">
  <div class="eyebrow rv" data-i18n="eb_work"></div>

const STEPS=[
 {t:{ar:"نتكلم",en:"We talk"},d:{ar:"مكالمة أو رسالة واتساب نعرف فيها شغلك وعايز توصل لإيه.",en:"A call or a WhatsApp chat about your business and where you want to get."}},

 {t:{ar:"مفيش حاجة تنزل من غيرك",en:"Nothing goes out without you"},d:{ar:"كل بوست وكل فيديو بيعدّي عليك الأول.",en:"Every post and every video goes past you first."}}
];
const TOOLS=["Premiere Pro","Photoshop","CapCut","Canva","ChatGPT","Claude","Gemini","ElevenLabs","RunwayML","Sora","Pika","Meta Ads Manager","Meta Business Suite"];

/* ---------- منطق ---------- */
let lang=(()=>{try{const s=localStorage.getItem("lq-lang");if(s==="ar"||s==="en")return s}catch(e){}return "ar"})();
let filter="all",expanded=false;const PAGE=16;
const $=id=>document.getElementById(id);
const L=v=>v&&typeof v==="object"?v[lang]:v;
const t=k=>T[lang][k];
const h=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const RM=matchMedia("(prefers-reduced-motion: reduce)").matches;

let io;
function observe(root){
  if(!io)io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){e.target.classList.add("in");io.unobserve(e.target);if(e.target.dataset.count!==undefined)countUp(e.target)}}),{threshold:.15,rootMargin:"0px 0px -40px 0px"});
  (root||document).querySelectorAll(".rv:not(.in),.step:not(.in),[data-count]").forEach(el=>io.observe(el));
}
function countUp(el){
  const raw=el.dataset.count,m=raw.match(/([\d.]+)(.*)/);if(!m||RM){el.textContent=raw;return}
  const end=parseFloat(m[1]),suf=m[2],dec=(m[1].split(".")[1]||"").length,t0=performance.now(),D=1600;
  const tick=n=>{const p=Math.min(1,(n-t0)/D),e=1-Math.pow(1-p,3);el.textContent=(end*e).toFixed(dec)+suf;if(p<1)requestAnimationFrame(tick)};requestAnimationFrame(tick);
}

function applyStatic(){
  document.documentElement.lang=lang;document.documentElement.dir=lang==="ar"?"rtl":"ltr";
  document.querySelectorAll("[data-i18n]").forEach(e=>e.textContent=t(e.dataset.i18n));
  const acc=T[lang].heroAcc;
  $("heroTitle").innerHTML=T[lang].hero.map((w,i)=>`<span class="hw" style="--i:${i}">${acc.includes(i)?`<em>${h(w)}</em>`:h(w)}</span>`).join(" ");
  $("langBtn").textContent=lang==="ar"?"EN":"عربي";
  document.querySelectorAll(".wa").forEach(a=>a.href=`https://wa.me/${WHATSAPP}`);
  $("stats").innerHTML=[["7.1M+","s1"],["17","s2"],["3","s3"],["560K+","s4"]].map(([n,a])=>`<div class="stat"><b data-count="${n}">0</b><span>${t(a)}</span></div>`).join("");
}
function renderStrip(){
  const items=WORK.filter(w=>w.th&&IMG["th-"+w.th]);
  const half=Math.ceil(items.length/2);
  const row=list=>{const s=list.map(w=>`<a class="reel" href="${h(w.url)}" target="_blank" rel="noopener"><img src="${im("th-"+w.th)}" alt="" loading="lazy">${w.v?`<span>${h(w.v)}</span>`:""}</a>`).join("");return s+s};
  $("strip1").innerHTML=row(items.slice(0,half));$("strip2").innerHTML=row(items.slice(half));
}
function renderClients(){
  const tile=([k,n])=>`<div class="lgw"><div class="lg${FIT_CT.has(k)?" ct":""}"><img src="${im("logo-"+k)}" alt="${h(L(n))}" loading="lazy"></div><span class="lg-name"><bdi>${h(L(n))}</bdi></span></div>`;
  const a=CLIENTS.slice(0,9),b=CLIENTS.slice(9);
  $("logoTrack").innerHTML=(a.map(tile).join("")).repeat(2);
  $("logoTrack2").innerHTML=(b.concat(a.slice(0,1)).map(tile).join("")).repeat(2);
}
function renderCases(){
  $("caseGrid").innerHTML=CASES.map((c,i)=>`<article class="case rv zoom" style="--d:${i%2*.12}s"><div class="bg" style="background-image:url('${im("th-"+c.bg)}')"></div><i class="corner c1"></i><i class="corner c2"></i><span class="rd">REC</span><div class="in"><div class="clogo"><img src="${im("logo-"+c.logo)}" alt=""></div><div class="tag">${h(L(c.tag))}</div><h3>${h(L(c.name))}</h3><p>${h(L(c.d))}</p><div><span class="num" data-count="${c.num}">0</span><small style="color:var(--mut);margin-inline-start:8px">${t("views")}</small></div>${c.fwz?`<span class="badge">${t("prod_fwz")}</span>`:""}</div></article>`).join("");
  $("stratGrid").innerHTML=STRAT.map((s,i)=>`<div class="box rv" style="--d:${i*.1}s"><div class="top"><img src="${im("logo-"+s.logo)}" alt="" style="${FIT_CT.has(s.logo)?"object-fit:contain;padding:3px":""}"><div class="k">${h(s.k)}</div></div><h3>${h(L(s.t))}</h3><p>${h(L(s.d))}</p></div>`).join("");
}
function renderChips(){
  $("chips").innerHTML=GROUPS.map(([k,n,lg])=>k==="all"?`<button class="chip all${filter==="all"?" on":""}" data-g="all" type="button">${t("all")}</button>`:`<button class="chip${k===filter?" on":""}" data-g="${k}" type="button"><img src="${im("logo-"+lg)}" alt="">${h(L(n))}</button>`).join("");
  $("chips").querySelectorAll(".chip").forEach(b=>b.onclick=()=>{filter=b.dataset.g;expanded=false;renderChips();renderWork()});
}
function card(w,i){
  const thumb=w.th&&IMG["th-"+w.th];
  let th;
  if(thumb)th=`<div class="th"><img src="${thumb}" alt="" loading="lazy">`;
  else{const lg=GLOGO[w.g],src=im("logo-"+lg);th=`<div class="th lo"><img class="blur" src="${src}" alt=""><img class="mark${FIT_CT.has(lg)?" ct":""}" src="${src}" alt="" loading="lazy">`}
  th+=`<span class="plat">${h(w.p)}</span>${w.v?`<span class="views">${h(w.v)}</span>`:""}${w.url?'<span class="play"></span>':""}</div>`;
  const sub=w.note?L(w.note):"";
  const meta=`<div class="meta"><b>${h(L(w.t))}</b>${sub?`<span>${h(sub)}</span>`:""}</div>`;
  const st=`style="--i:${i%PAGE}"`;
  return w.url?`<a class="w" ${st} href="${h(w.url)}" target="_blank" rel="noopener">${th}${meta}</a>`:`<div class="w" ${st}>${th}${meta}</div>`;
}
function renderWork(){
  const list=WORK.filter(w=>filter==="all"||w.g===filter);
  const shown=expanded||filter!=="all"?list:list.slice(0,PAGE);
  $("workGrid").innerHTML=shown.map(card).join("");
  const b=$("moreBtn");
  if(filter==="all"&&list.length>PAGE){b.style.display="";b.textContent=expanded?t("less"):`${t("more")} (${list.length-PAGE})`}else b.style.display="none";
}
function renderServices(){
  $("svcGrid").innerHTML=SERVICES.map((s,i)=>`<div class="box rv" style="--d:${(i%3)*.08}s"><div class="n">${String(i+1).padStart(2,"0")}</div><h3>${h(L(s.t))}</h3><p>${h(L(s.d))}</p></div>`).join("");
  $("steps").innerHTML=STEPS.map((s,i)=>`<div class="step rv" style="--d:${i*.2}s"><b><i>0${i+1}</i>${h(L(s.t))}</b><p>${h(L(s.d))}</p></div>`).join("");
  $("tools").innerHTML=TOOLS.concat(TOOLS).map(x=>`<span>${h(x)}</span>`).join("");
  document.querySelectorAll(".svc .box").forEach(b=>b.addEventListener("pointermove",e=>{const r=b.getBoundingClientRect();b.style.setProperty("--x",e.clientX-r.left+"px");b.style.setProperty("--y",e.clientY-r.top+"px")}));
}
function renderAll(){applyStatic();renderStrip();renderClients();renderCases();renderChips();renderWork();renderServices();observe()}
$("langBtn").onclick=()=>{lang=lang==="ar"?"en":"ar";try{localStorage.setItem("lq-lang",lang)}catch(e){}renderAll()};
$("moreBtn").onclick=()=>{expanded=!expanded;renderWork();if(!expanded)$("work").scrollIntoView()};

/* حركات عامة */
const hero=$("top");
hero.addEventListener("pointermove",e=>{const r=hero.getBoundingClientRect();hero.style.setProperty("--mx",e.clientX-r.left+"px");hero.style.setProperty("--my",e.clientY-r.top+"px")});
let f=0;setInterval(()=>{f++;const fr=f%25,s=Math.floor(f/25),p=n=>String(n).padStart(2,"0");$("tc").textContent=`00:${p(Math.floor(s/60)%60)}:${p(s%60)}:${p(fr)}`},40);
let ticking=false;
addEventListener("scroll",()=>{if(ticking)return;ticking=true;requestAnimationFrame(()=>{
  const y=scrollY,H=document.documentElement.scrollHeight-innerHeight;
  $("bar").style.width=(H>0?y/H*100:0)+"%";
  $("nav").classList.toggle("sc",y>10);
  $("fab").classList.toggle("on",y>innerHeight*.7);
  if(!RM)document.querySelectorAll(".case").forEach(c=>{const r=c.getBoundingClientRect();if(r.bottom>0&&r.top<innerHeight){c.querySelector(".bg").style.setProperty("--py",((r.top+r.height/2-innerHeight/2)*-.06).toFixed(1)+"px")}});
  ticking=false})},{passive:true});
renderAll();
</script>
